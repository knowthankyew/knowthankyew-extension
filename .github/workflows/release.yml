name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build, Attest & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Audit Dependencies
        run: npm audit --audit-level=high

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Build Production Extension
        run: npm run build

      - name: Verify Zero-Egress Invariant
        run: |
          echo "Scanning all built artifacts for network egress primitives..."
          if grep -rEn "fetch\(|WebSocket|sendBeacon|XMLHttpRequest|EventSource|importScripts" dist --include='*.js'; then
            echo "ERROR: Network egress primitive detected in production extension bundle!"
            exit 1
          fi
          echo "PASS: Absolute zero-egress verified across all dist JS bundles."

      - name: Run Test Suite
        run: npm test

      - name: Extract Version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Package Chrome Web Store ZIP Bundle (Zero-Egress Production)
        run: |
          cd dist
          zip -r ../knowthankyew-extension-v${{ steps.version.outputs.version }}.zip .
          cd ..

      - name: Build & Package Local Assist Developer Bundle
        run: |
          VITE_LOCAL_ML_ENABLED=true npx vite build
          cd dist
          zip -r ../knowthankyew-extension-v${{ steps.version.outputs.version }}-local-assist.zip .
          cd ..
          # Rebuild pristine production zero-egress extension to leave dist clean
          npm run build

      - name: Generate Checksums
        run: |
          shasum -a 256 knowthankyew-extension-v${{ steps.version.outputs.version }}*.zip > SHA256SUMS
          echo "Generated SHA256 Checksums:"
          cat SHA256SUMS

      - name: Generate CycloneDX SBOM
        run: npx --yes @cyclonedx/cdxgen -o bom.json

      - name: Attest Build Provenance (SLSA)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            bom.json
            knowthankyew-extension-v${{ steps.version.outputs.version }}.zip
            knowthankyew-extension-v${{ steps.version.outputs.version }}-local-assist.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: KnowThankYew Reality Engine v${{ steps.version.outputs.version }}
          body: |
            ## KnowThankYew Reality Engine v${{ steps.version.outputs.version }}

            ### Package Options
            - **Standard Zero-Egress Edition**: `knowthankyew-extension-v${{ steps.version.outputs.version }}.zip`
              - 100% air-gapped on-device heuristic engine.
              - Physically strips all network primitives (`connect-src 'none'`).
              - Official build submitted to the Chrome Web Store.
            - **Developer Local Assist Edition**: `knowthankyew-extension-v${{ steps.version.outputs.version }}-local-assist.zip`
              - Includes loopback client (`http://127.0.0.1:8420`) for AppSec researchers running local LLMs (Ollama, llama.cpp, FTaaS).
              - See `SECURITY.md` for the explicit trust delta and security boundary.

            ### Installation (Unpacked Developer Mode)
            1. Download your preferred package zip below
            2. Unzip the downloaded file
            3. Navigate to `chrome://extensions` (or `brave://extensions`)
            4. Enable **Developer mode** (toggle in top-right)
            5. Click **Load unpacked** and select the unzipped folder

            ### Verification & Supply Chain Integrity
            - SHA256 checksums: see `SHA256SUMS`
            - Software Bill of Materials (SBOM): see `bom.json`
            - Cryptographic build provenance: SLSA Level 3 attestation attached to this release
          files: |
            knowthankyew-extension-v${{ steps.version.outputs.version }}.zip
            knowthankyew-extension-v${{ steps.version.outputs.version }}-local-assist.zip
            SHA256SUMS
            bom.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload & Publish to Chrome Web Store
        if: env.CWS_CLIENT_ID != ''
        uses: mobilefirstllc/cws-publish@latest
        with:
          action: 'publish'
          client_id: ${{ secrets.CWS_CLIENT_ID }}
          client_secret: ${{ secrets.CWS_CLIENT_SECRET }}
          refresh_token: ${{ secrets.CWS_REFRESH_TOKEN }}
          extension_id: 'pbgjjgggmeecalifcgggiondfminilnl'
          zip_file: 'knowthankyew-extension-v${{ steps.version.outputs.version }}.zip'
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
