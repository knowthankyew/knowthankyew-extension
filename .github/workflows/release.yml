name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build, Attest & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Audit Dependencies
        run: npm audit --audit-level=high

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Build Production Extension
        run: npm run build

      - name: Verify Zero-Egress Invariant
        run: |
          echo "Scanning all built artifacts for network egress primitives..."
          if grep -rEn "fetch\(|WebSocket|sendBeacon|XMLHttpRequest|EventSource|importScripts" dist --include='*.js'; then
            echo "ERROR: Network egress primitive detected in production extension bundle!"
            exit 1
          fi
          echo "PASS: Absolute zero-egress verified across all dist JS bundles."

      - name: Run Test Suite
        run: npm test

      - name: Extract Version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Package Multi-Browser Distribution Bundles (Chrome, Firefox, Safari, Local-Assist)
        run: |
          npm run package
          npm run package:firefox
          npm run package:safari
          npm run package:local-assist

      - name: Verify Zero-Egress Invariant across Production Bundles
        run: |
          echo "Scanning all production bundles (dist, dist-firefox, dist-safari) for network egress primitives..."
          if grep -rEn "fetch\(|WebSocket|sendBeacon|XMLHttpRequest|EventSource|importScripts" dist dist-firefox dist-safari --include='*.js'; then
            echo "ERROR: Network egress primitive detected in production extension bundle!"
            exit 1
          fi
          echo "PASS: Absolute zero-egress verified across all production bundles."

      - name: Generate Checksums
        run: |
          shasum -a 256 knowthankyew-extension-v${{ steps.version.outputs.version }}*.zip > SHA256SUMS
          echo "Generated SHA256 Checksums:"
          cat SHA256SUMS

      - name: Generate CycloneDX SBOM
        run: npx --yes @cyclonedx/cdxgen -o bom.json

      - name: Attest Build Provenance (SLSA)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            bom.json
            knowthankyew-extension-v${{ steps.version.outputs.version }}.zip
            knowthankyew-extension-v${{ steps.version.outputs.version }}-firefox.zip
            knowthankyew-extension-v${{ steps.version.outputs.version }}-safari.zip
            knowthankyew-extension-v${{ steps.version.outputs.version }}-local-assist.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: KnowThankYew Reality Engine v${{ steps.version.outputs.version }}
          body: |
            ## KnowThankYew Reality Engine v${{ steps.version.outputs.version }}

            ### Package Options
            - **Chrome / Chromium (MV3)**: `knowthankyew-extension-v${{ steps.version.outputs.version }}.zip`
            - **Mozilla Firefox (Gecko)**: `knowthankyew-extension-v${{ steps.version.outputs.version }}-firefox.zip`
            - **Apple Safari (macOS / iOS)**: `knowthankyew-extension-v${{ steps.version.outputs.version }}-safari.zip`
            - **Developer Local Assist Edition**: `knowthankyew-extension-v${{ steps.version.outputs.version }}-local-assist.zip`

            ### Verification & Supply Chain Integrity
            - SHA256 checksums: see `SHA256SUMS`
            - Software Bill of Materials (SBOM): see `bom.json`
            - Cryptographic build provenance: SLSA Level 3 attestation attached to this release
          files: |
            knowthankyew-extension-v${{ steps.version.outputs.version }}.zip
            knowthankyew-extension-v${{ steps.version.outputs.version }}-firefox.zip
            knowthankyew-extension-v${{ steps.version.outputs.version }}-safari.zip
            knowthankyew-extension-v${{ steps.version.outputs.version }}-local-assist.zip
            SHA256SUMS
            bom.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload & Publish to Chrome Web Store
        if: env.CWS_CLIENT_ID != ''
        uses: mobilefirstllc/cws-publish@latest
        with:
          action: 'publish'
          client_id: ${{ secrets.CWS_CLIENT_ID }}
          client_secret: ${{ secrets.CWS_CLIENT_SECRET }}
          refresh_token: ${{ secrets.CWS_REFRESH_TOKEN }}
          extension_id: 'pbgjjgggmeecalifcgggiondfminilnl'
          zip_file: 'knowthankyew-extension-v${{ steps.version.outputs.version }}.zip'
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
