name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build, Attest & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Audit Dependencies
        run: npm audit --audit-level=high

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Build Production Extension
        run: npm run build

      - name: Verify Zero-Egress Invariant
        run: |
          echo "Scanning all built artifacts for network egress primitives..."
          if grep -rEn "fetch\(|WebSocket|sendBeacon|XMLHttpRequest|EventSource|importScripts" dist --include='*.js'; then
            echo "ERROR: Network egress primitive detected in production extension bundle!"
            exit 1
          fi
          echo "PASS: Absolute zero-egress verified across all dist JS bundles."

      - name: Run Test Suite
        run: npm test

      - name: Extract Version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Package Chrome Web Store ZIP Bundle
        run: |
          cd dist
          zip -r ../knowthankyew-extension-v${{ steps.version.outputs.version }}.zip .
          cd ..
          shasum -a 256 knowthankyew-extension-v${{ steps.version.outputs.version }}.zip > SHA256SUMS
          echo "ZIP SHA256: $(cat SHA256SUMS)"

      - name: Generate CycloneDX SBOM
        run: npx --yes @cyclonedx/cdxgen -o bom.json

      - name: Attest Build Provenance (SLSA)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            bom.json
            knowthankyew-extension-v${{ steps.version.outputs.version }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: KnowThankYew Reality Engine v${{ steps.version.outputs.version }}
          body: |
            ## KnowThankYew Reality Engine v${{ steps.version.outputs.version }}

            ### Installation
            1. Download `knowthankyew-extension-v${{ steps.version.outputs.version }}.zip` below
            2. Unzip the downloaded file
            3. Navigate to `chrome://extensions` (or `brave://extensions`)
            4. Enable **Developer mode** (toggle in top-right)
            5. Click **Load unpacked** and select the unzipped folder

            ### Verification
            - SHA256 checksum: see `SHA256SUMS`
            - Software Bill of Materials: see `bom.json`
            - SLSA build provenance attestation attached to this release

            ### Chrome Web Store
            _Coming soon — or install from source above._
          files: |
            knowthankyew-extension-v${{ steps.version.outputs.version }}.zip
            SHA256SUMS
            bom.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
