name: Statutory & Regulatory Monitor

on:
  schedule:
    # Run daily at 06:00 UTC for legally defensible compliance monitoring across Federal Register, EUR-Lex & UK feeds
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      mock:
        description: 'Simulate regulatory updates for pipeline testing'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  monitor:
    name: Check Federal Register, EUR-Lex & UK Legislation Feeds
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify TypeScript & Policy ReDoS Test Suite
        run: |
          npx tsc --noEmit
          npm test

      - name: Query Federal Register, EUR-Lex & UK Regulatory APIs
        id: check_statutes
        run: |
          if [ "${{ inputs.mock }}" = "true" ]; then
            node scripts/check-statutory-updates.mjs --mock
          else
            node scripts/check-statutory-updates.mjs
          fi

      - name: Create Pull Request on Statutory Change
        id: cpr
        if: steps.check_statutes.outputs.has_updates == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: 'chore(legal): statutory update notices detected by policy monitor'
          branch: bot/statutory-update-${{ github.run_id }}
          delete-branch: true
          title: '[Legal Update] Regulatory & Statutory Changes Detected in US, UK & EU Feeds'
          body-path: statutory-update-report.md
          labels: |
            statutory-review
            automerge
          draft: false

      - name: Auto-Merge Statutory Update PR
        if: steps.check_statutes.outputs.has_updates == 'true' && steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Auto-merging statutory update PR #${{ steps.cpr.outputs.pull-request-number }}..."
          gh pr merge ${{ steps.cpr.outputs.pull-request-number }} --squash --delete-branch
