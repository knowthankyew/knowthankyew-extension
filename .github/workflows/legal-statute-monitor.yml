name: Statutory & Regulatory Monitor

on:
  schedule:
    # Run daily at 06:00 UTC for legally defensible compliance monitoring across Federal Register, EUR-Lex & UK feeds
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      mock:
        description: 'Simulate regulatory updates for pipeline testing'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bot-statutory-update-review
  cancel-in-progress: false

jobs:
  monitor:
    name: Check Federal Register, EUR-Lex & UK Legislation Feeds
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build & Verify TypeScript & Test Suite
        run: |
          npx tsc --noEmit
          npm run build
          npm test

      - name: Query Federal Register, EUR-Lex & UK Regulatory APIs
        id: check_statutes
        run: |
          if [ "${{ inputs.mock }}" = "true" ]; then
            node scripts/check-statutory-updates.mjs --mock
          else
            node scripts/check-statutory-updates.mjs
          fi

      - name: Create Pull Request on Statutory Change
        id: cpr
        if: steps.check_statutes.outputs.has_updates == 'true' || steps.check_statutes.outputs.check_failed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(legal): statutory update notices detected by policy monitor'
          branch: bot/statutory-update-review
          delete-branch: true
          title: '[Legal Update] Regulatory & Statutory Changes Detected in US, UK & EU Feeds'
          body-path: statutory-update-report.md
          labels: |
            statutory-review
            needs-attorney-review
          draft: true
