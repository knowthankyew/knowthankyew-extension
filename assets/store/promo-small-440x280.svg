<svg xmlns="http://www.w3.org/2000/svg" width="440" height="280" viewBox="0 0 440 280">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1f2937" stroke-width="0.75" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="440" height="280" fill="url(#bg)"/>
  <rect width="440" height="280" fill="url(#grid)"/>

  <!-- Glowing accent behind icon -->
  <circle cx="220" cy="90" r="55" fill="#10b981" opacity="0.12" filter="blur(15px)"/>

  <!-- Shield Icon -->
  <g transform="translate(196, 66) scale(1.1)">
    <path d="M22 2L4 8v10c0 11.5 7.7 22.3 18 25 10.3-2.7 18-13.5 18-25V8L22 2z" fill="url(#shieldGrad)"/>
    <path d="M15 21l5 5 10-10" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Title -->
  <text x="220" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">KnowThankYew</text>

  <!-- Subtitle -->
  <text x="220" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#9ca3af" text-anchor="middle" letter-spacing="1.5">ZERO-EGRESS CONSUMER ADVOCATE</text>

  <!-- Badge / Pill -->
  <g transform="translate(130, 215)">
    <rect width="180" height="26" rx="13" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <text x="90" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#10b981" text-anchor="middle">AIR-GAPPED REALITY ENGINE</text>
  </g>
